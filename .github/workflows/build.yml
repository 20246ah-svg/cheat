name: Build

on:
  push:
  pull_request:

jobs:
  windows-x86:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Win32 Release
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release --parallel
